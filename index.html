<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBT Ujian</title>
  <link rel="icon" href="data:,">
  <style>@font-face { font-family: 'Naskh'; src: url('https://cdn.jsdelivr.net/npm/@fontsource/noto-naskh-arabic@5.3.0/files/noto-naskh-arabic-arabic-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'Naskh'; src: url('https://cdn.jsdelivr.net/npm/@fontsource/noto-naskh-arabic@5.3.0/files/noto-naskh-arabic-arabic-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }

:root {
  --hijau: #0f766e; --hijau-tua: #115e59; --hijau-muda: #ccfbf1;
  --teks: #1f2937; --redup: #6b7280; --garis: #e5e7eb; --latar: #f6f7f9; --putih: #fff;
  --merah: #b91c1c; --kuning: #fde68a; --biru: #dbeafe;
  --radius: 10px;
  /* Huruf latin pakai font sistem; huruf Arab otomatis memakai Naskh lewat unicode-range. */
  --font: 'Naskh', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--teks); background: var(--latar); line-height: 1.5; }
h1 { font-size: 1.5rem; margin: 0 0 .75rem; } h2 { font-size: 1.2rem; margin: 0 0 .5rem; } h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
a { color: var(--hijau); }
code { font-size: 1.05em; }
.memuat, .redup { color: var(--redup); }
.galat { color: var(--merah); }
.kecil-teks { font-size: .85rem; }

button, .tombol {
  font: inherit; font-weight: 600; border: 1px solid var(--hijau); background: var(--hijau); color: #fff;
  padding: .55rem 1rem; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; min-height: 40px;
}
button:hover, .tombol:hover { background: var(--hijau-tua); }
button:disabled { opacity: .55; cursor: not-allowed; }
button:focus-visible, .tombol:focus-within, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }
.sekunder { background: #fff; color: var(--hijau); }
.sekunder:hover { background: var(--hijau-muda); }
.bahaya { background: var(--merah); border-color: var(--merah); color: #fff; }
.sekunder.bahaya { background: #fff; color: var(--merah); }
.kecil { padding: .3rem .65rem; min-height: 32px; font-size: .9rem; }
.lebar { width: 100%; justify-content: center; }

input, select, textarea { font: inherit; padding: .5rem .6rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; width: 100%; min-height: 40px; }
textarea { resize: vertical; }
label { display: block; font-weight: 600; margin-bottom: .75rem; }
label > input, label > select, label > textarea { margin-top: .25rem; font-weight: 400; }
label.cek, label.sakelar { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
label.cek input, label.sakelar input { width: auto; min-height: auto; }
fieldset { border: 1px solid var(--garis); border-radius: var(--radius); padding: .75rem; margin: 0 0 .75rem; }
legend { font-weight: 600; padding: 0 .3rem; }
.dua { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.tiga { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .75rem; }
@media (max-width: 640px) { .dua, .tiga { grid-template-columns: 1fr; } }

.atas { display: flex; align-items: center; gap: 1rem; background: #fff; border-bottom: 1px solid var(--garis); padding: .5rem 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
.merek { font-weight: 700; color: var(--hijau); font-size: 1.1rem; }
.atas nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.atas nav a { padding: .4rem .75rem; border-radius: 8px; text-decoration: none; color: var(--teks); }
.atas nav a.aktif { background: var(--hijau-muda); color: var(--hijau-tua); font-weight: 600; }
.pengguna { display: flex; align-items: center; gap: .6rem; }
main { padding: 1rem; max-width: 1200px; margin: 0 auto; }

.kartu { background: #fff; border: 1px solid var(--garis); border-radius: var(--radius); padding: 1rem; }
.judul-hal { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin: .5rem 0 .75rem; }
.judul-hal h1, .judul-hal h2 { margin: 0; }
.aksi { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.filter { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
.filter select, .filter input { width: auto; min-width: 160px; }
.label { font-size: .8rem; color: var(--redup); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.lencana { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.lencana.hijau { background: var(--hijau-muda); color: var(--hijau-tua); }
.lencana.biru { background: var(--biru); color: #1e40af; }
.lencana.abu { background: #f3f4f6; color: #4b5563; }
.ringkas { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0; }

.tabel-gulir { overflow-x: auto; background: #fff; border: 1px solid var(--garis); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: start; padding: .5rem .65rem; border-bottom: 1px solid var(--garis); vertical-align: top; }
th { background: #f9fafb; font-size: .85rem; color: #374151; position: sticky; top: 0; }
tr.klik { cursor: pointer; } tr.klik:hover { background: #f9fafb; }
tr.baris-galat td { background: #fef2f2; }

.grid-soal { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: .75rem; }
.kartu.soal { display: flex; flex-direction: column; gap: .4rem; }
.kartu.soal .aksi { margin-top: auto; }
.teks-soal p { margin: 0 0 .35rem; white-space: pre-wrap; }
.teks-soal p[dir="rtl"], .teks-soal p:dir(rtl), .isi-opsi:dir(rtl) { font-size: 1.3em; line-height: 1.9; }
.teks-soal.besar { font-size: 1.1rem; }
.opsi-kecil { list-style: none; padding: 0; margin: 0; font-size: .92rem; }
.opsi-kecil li { padding: .1rem .3rem; border-radius: 6px; }
.opsi-kecil li.benar { background: var(--hijau-muda); }
.opsi-kecil li:dir(rtl) { font-size: 1.15em; }
.baris-opsi { display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem; }
.baris-opsi .kunci { display: flex; align-items: center; gap: .25rem; margin: 0; min-width: 52px; }
.baris-opsi .kunci input { width: auto; min-height: auto; }
.daftar-pilih { max-height: 300px; overflow: auto; border: 1px solid var(--garis); border-radius: 8px; }
.cek-soal { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; margin: 0; padding: .45rem .6rem; border-bottom: 1px solid var(--garis); }
.cek-soal input { width: auto; min-height: auto; margin-top: .3rem; }
.cek-soal span:dir(rtl) { font-size: 1.15em; }

.info-ujian { display: grid; grid-template-columns: 220px 1fr; gap: .75rem; }
@media (max-width: 640px) { .info-ujian { grid-template-columns: 1fr; } }
.token-box { text-align: center; }
.token { font-size: 2rem; font-weight: 700; letter-spacing: .2em; font-family: ui-monospace, monospace; color: var(--hijau-tua); margin: .25rem 0 .5rem; }

dialog { border: none; border-radius: 14px; padding: 0; width: calc(100% - 2rem); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dlg-kepala { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.1rem; border-bottom: 1px solid var(--garis); }
.dlg-kepala h2 { margin: 0; }
.dlg-isi { padding: 1rem 1.1rem; max-height: 75vh; overflow: auto; }
.dlg-isi .aksi { margin-top: 1rem; }
.tutup { background: none; border: none; color: var(--redup); font-size: 1.6rem; padding: 0 .4rem; min-height: auto; }
.tutup:hover { background: #f3f4f6; }
.input-token { font-size: 1.6rem; text-align: center; letter-spacing: .25em; text-transform: uppercase; font-family: ui-monospace, monospace; }

.toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: .7rem 1.1rem; border-radius: 10px; z-index: 1000; max-width: calc(100% - 2rem); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.galat { background: var(--merah); }

.halaman-login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: linear-gradient(160deg, #ccfbf1, #f6f7f9 60%); }
.kartu.login { width: 100%; max-width: 380px; padding: 1.5rem; }
.kartu.login h1 { text-align: center; color: var(--hijau); }
.tab { display: flex; gap: .25rem; background: #f3f4f6; padding: .25rem; border-radius: 10px; margin-bottom: 1rem; }
.tab button { flex: 1; background: transparent; color: var(--teks); border: none; justify-content: center; }
.tab button.aktif { background: #fff; color: var(--hijau-tua); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.kartu.login form button[type=submit], #google { width: 100%; justify-content: center; }

.daftar-ujian { display: grid; gap: .75rem; }
.ujian-item { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; }
.ujian-item .kanan { display: flex; gap: .75rem; align-items: center; }
.kartu.tengah { max-width: 520px; margin: 2rem auto; text-align: center; }

.ujian { max-width: 1100px; margin: 0 auto; }
.bar-ujian { display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: #fff; border: 1px solid var(--garis); border-radius: var(--radius); padding: .6rem 1rem; margin-bottom: .75rem; position: sticky; top: 58px; z-index: 4; flex-wrap: wrap; }
.waktu { font-family: ui-monospace, monospace; font-size: 1.4rem; font-weight: 700; background: var(--hijau-muda); color: var(--hijau-tua); padding: .2rem .7rem; border-radius: 8px; }
.waktu.mepet { background: #fee2e2; color: var(--merah); }
.status-simpan { font-size: .85rem; color: var(--redup); }
.status-simpan.ok { color: var(--hijau); } .status-simpan.peringatan { color: #b45309; font-weight: 600; }
.badan-ujian { display: grid; grid-template-columns: 1fr 260px; gap: .75rem; align-items: start; }
@media (max-width: 800px) { .badan-ujian { grid-template-columns: 1fr; } .bar-ujian { top: 0; } }
.kepala-soal { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
.ragu-cek { margin: 0; background: #fffbeb; padding: .25rem .6rem; border-radius: 8px; }
.opsi { display: grid; gap: .5rem; margin: 1rem 0; }
.pilihan { background: #fff; color: var(--teks); border: 2px solid var(--garis); justify-content: flex-start; text-align: start; font-weight: 400; padding: .7rem .8rem; }
.pilihan:hover { background: #f0fdfa; border-color: #99f6e4; }
.pilihan.dipilih { border-color: var(--hijau); background: var(--hijau-muda); }
.pilihan .huruf { flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: #f3f4f6; font-weight: 700; }
.pilihan.dipilih .huruf { background: var(--hijau); color: #fff; }
.isi-opsi { flex: 1; }
.nav-soal { display: flex; justify-content: space-between; gap: .5rem; }
.grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; margin: .5rem 0 .75rem; }
.grid-nomor button { background: #fff; color: var(--teks); border: 1px solid #cbd5e1; padding: 0; min-height: 38px; justify-content: center; font-weight: 600; }
.grid-nomor button.dijawab { background: var(--hijau); color: #fff; border-color: var(--hijau); }
.grid-nomor button.ragu { background: var(--kuning); color: #78350f; border-color: #f59e0b; }
.grid-nomor button.kini { outline: 3px solid #0ea5e9; outline-offset: 1px; }
.legenda { display: flex; gap: .4rem; align-items: center; font-size: .82rem; color: var(--redup); margin-bottom: .75rem; }
.kotak { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-left: .4rem; }
.kotak.dijawab { background: var(--hijau); } .kotak.ragu { background: var(--kuning); border: 1px solid #f59e0b; }
label.tombol { margin-bottom: 0; }
.tengah-teks { text-align: center; margin-top: 0; }
.grid-akun { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem; align-items: start; }
.grid-akun h2 { margin-bottom: .75rem; }
.peringatan-kotak { background: #fffbeb; border-color: #f59e0b; color: #78350f; margin-bottom: .75rem; }
.pilih-kelas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .25rem .75rem; }
.pilih-kelas label { margin: 0; }
</style>
</head>
